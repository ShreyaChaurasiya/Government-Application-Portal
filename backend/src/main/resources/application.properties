spring.application.name=application-management-system
server.port=8080

# Local file-backed H2 database
spring.datasource.url=jdbc:h2:file:./data/application_management_db;DB_CLOSE_DELAY=-1;FILE_LOCK=NO
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# JWT — change in production
jwt.secret=GovernmentApplicationPortalDevSecretKey2026MustBeAtLeast32Chars
jwt.expiration=86400000

# Verification & OTP (demo: OTP shown in API response for testing)
app.verification-url=http://localhost:5173/verify
app.dev-skip-email=true
app.dev-show-otp=true
app.otp-expiry-minutes=10

# Mail (configure for production)
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false

# Logging — console + file (logs/application-portal.log)
logging.file.name=logs/application-portal.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=14
logging.level.root=INFO
logging.level.com.cdac.application_management_system=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
