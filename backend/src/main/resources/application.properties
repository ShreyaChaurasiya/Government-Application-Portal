spring.application.name=application-management-system
server.port=8080

# Local file-backed H2 database
spring.datasource.url=jdbc:h2:file:./data/application_management_db;DB_CLOSE_DELAY=-1;FILE_LOCK=NO
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# JWT (use a long random secret in production)
jwt.secret=GovernmentApplicationPortalDevSecretKey2026MustBeAtLeast32Chars
jwt.expiration=86400000

# Email verification link base (frontend route)
app.verification-url=http://localhost:5173/verify

# Local dev: skip SMTP and auto-verify accounts so signup/login works without mail setup
app.dev-skip-email=true
app.dev-auto-verify=true

# Mail (only used when app.dev-skip-email=false)
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
